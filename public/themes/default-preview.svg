<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Top Announcement Bar -->
  <rect width="800" height="28" fill="#1e293b"/>
  <text x="400" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">⚡ FREE DELIVERY ON ORDERS OVER ৳1,500 | 24/7 CUSTOMER SUPPORT</text>

  <!-- Header / Navbar -->
  <rect y="28" width="800" height="60" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Logo -->
  <rect x="40" y="44" width="28" height="28" rx="6" fill="#2563eb"/>
  <text x="76" y="63" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="-0.5">STORE<tspan fill="#2563eb">FRONT.</tspan></text>

  <!-- Search Bar -->
  <rect x="220" y="42" width="340" height="34" rx="17" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="238" cy="59" r="6" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <line x1="242" y1="63" x2="248" y2="69" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Search any product, brand or category...</text>

  <!-- Header Right Icons / Actions -->
  <rect x="590" y="46" width="76" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="628" y="63" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Sign In</text>
  <rect x="680" y="42" width="80" height="34" rx="8" fill="#2563eb"/>
  <text x="720" y="64" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cart (3)</text>

  <!-- Category Nav Strip -->
  <rect y="88" width="800" height="32" fill="#ffffff"/>
  <line x1="0" y1="88" x2="800" y2="88" stroke="#f1f5f9"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#e2e8f0"/>
  <text x="40" y="109" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">All Categories</text>
  <text x="160" y="109" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Flash Deals</text>
  <text x="250" y="109" fill="#475569" font-family="system-ui, sans-serif" font-size="12">New Arrivals</text>
  <text x="350" y="109" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Trending</text>
  <text x="430" y="109" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Top Brands</text>
  <text x="520" y="109" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Sale -50%</text>

  <!-- Hero Banner -->
  <rect x="40" y="136" width="720" height="150" rx="14" fill="url(#hero)" filter="url(#shadow)"/>
  <circle cx="680" cy="160" r="90" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="600" cy="270" r="110" fill="#ffffff" fill-opacity="0.05"/>

  <rect x="70" y="160" width="90" height="22" rx="11" fill="url(#badge)"/>
  <text x="115" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">MEGA SALE</text>
  <text x="70" y="210" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Summer Essential Collection</text>
  <text x="70" y="232" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="13">Upgrade your lifestyle with top curated brands at the best prices.</text>
  <rect x="70" y="246" width="110" height="28" rx="6" fill="#ffffff"/>
  <text x="125" y="265" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Shop Now →</text>

  <!-- Section Header -->
  <text x="40" y="316" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Popular Products</text>
  <text x="760" y="316" fill="#2563eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">View All (42) →</text>

  <!-- Product Cards Grid (3 Cards) -->
  <!-- Card 1 -->
  <rect x="40" y="332" width="226" height="144" rx="10" fill="#ffffff" filter="url(#shadow)" stroke="#f1f5f9"/>
  <rect x="52" y="344" width="70" height="70" rx="8" fill="#e2e8f0"/>
  <text x="134" y="360" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Smart Fit Casual Shirt</text>
  <text x="134" y="378" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Apparel • Size M, L</text>
  <text x="134" y="404" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="800">৳ 1,450</text>
  <text x="188" y="404" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-decoration="line-through">৳ 1,800</text>
  <rect x="52" y="424" width="202" height="30" rx="6" fill="#f1f5f9"/>
  <text x="153" y="443" fill="#1e293b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Add to Cart</text>

  <!-- Card 2 -->
  <rect x="286" y="332" width="226" height="144" rx="10" fill="#ffffff" filter="url(#shadow)" stroke="#f1f5f9"/>
  <rect x="298" y="344" width="70" height="70" rx="8" fill="#e2e8f0"/>
  <text x="380" y="360" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Wireless Headset Pro</text>
  <text x="380" y="378" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Audio • ANC Enabled</text>
  <text x="380" y="404" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="800">৳ 3,200</text>
  <text x="434" y="404" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-decoration="line-through">৳ 3,900</text>
  <rect x="298" y="424" width="202" height="30" rx="6" fill="#f1f5f9"/>
  <text x="399" y="443" fill="#1e293b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Add to Cart</text>

  <!-- Card 3 -->
  <rect x="532" y="332" width="228" height="144" rx="10" fill="#ffffff" filter="url(#shadow)" stroke="#f1f5f9"/>
  <rect x="544" y="344" width="70" height="70" rx="8" fill="#e2e8f0"/>
  <text x="626" y="360" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Stainless Water Bottle</text>
  <text x="626" y="378" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Living • 750ml</text>
  <text x="626" y="404" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="800">৳ 850</text>
  <rect x="544" y="424" width="204" height="30" rx="6" fill="#2563eb"/>
  <text x="646" y="443" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Quick Buy</text>
</svg>
