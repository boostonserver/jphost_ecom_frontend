<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fashion-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ef"/>
      <stop offset="100%" stop-color="#f5ede3"/>
    </linearGradient>
    <linearGradient id="fashion-hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262220"/>
      <stop offset="100%" stop-color="#141110"/>
    </linearGradient>
    <filter id="f-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#fashion-bg)"/>

  <!-- Top Strip -->
  <rect width="800" height="26" fill="#1c1917"/>
  <text x="400" y="17" fill="#d6d3d1" font-family="'Times New Roman', serif" font-size="11" letter-spacing="2" text-anchor="middle">NEW LUXURY WINTER RUNWAY DROP • COMPLIMENTARY GIFT BOXING</text>

  <!-- Header -->
  <rect y="26" width="800" height="64" fill="#ffffff" filter="url(#f-shadow)"/>
  <text x="400" y="64" fill="#1c1917" font-family="'Times New Roman', serif" font-size="24" font-weight="700" letter-spacing="4" text-anchor="middle">A V E N U E</text>

  <text x="50" y="63" fill="#44403c" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">WOMEN</text>
  <text x="120" y="63" fill="#44403c" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">MEN</text>
  <text x="170" y="63" fill="#44403c" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">LOOKBOOK</text>

  <text x="680" y="63" fill="#1c1917" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">SEARCH</text>
  <text x="740" y="63" fill="#1c1917" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">BAG (1)</text>

  <!-- Hero Banner -->
  <rect x="40" y="104" width="720" height="170" fill="url(#fashion-hero)" rx="8" filter="url(#f-shadow)"/>
  <text x="80" y="146" fill="#ca8a04" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="3">EDITORIAL CAMPAIGN</text>
  <text x="80" y="185" fill="#f5f5f4" font-family="'Times New Roman', serif" font-size="30" font-style="italic">Autumn Silk &amp; Cashmere</text>
  <text x="80" y="210" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="12" letter-spacing="0.5">Handcrafted fabrics tailored for contemporary poise and subtle luxury.</text>
  <rect x="80" y="226" width="130" height="30" fill="#ffffff" rx="2"/>
  <text x="145" y="246" fill="#1c1917" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">EXPLORE DROP</text>

  <!-- Featured Grid Header -->
  <text x="400" y="306" fill="#1c1917" font-family="'Times New Roman', serif" font-size="18" letter-spacing="2" text-anchor="middle">CURATED ESSENTIALS</text>

  <!-- 3 Fashion Product Cards -->
  <!-- Card 1 -->
  <rect x="40" y="322" width="226" height="158" fill="#ffffff" rx="6" filter="url(#f-shadow)"/>
  <rect x="50" y="332" width="206" height="74" fill="#f5f5f4" rx="4"/>
  <text x="50" y="422" fill="#1c1917" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Pure Muslin Embroidered Tunic</text>
  <circle cx="56" cy="438" r="4" fill="#1c1917"/>
  <circle cx="68" cy="438" r="4" fill="#a8a29e"/>
  <circle cx="80" cy="438" r="4" fill="#e7e5e4"/>
  <text x="256" y="440" fill="#1c1917" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">৳ 4,800</text>
  <rect x="50" y="450" width="206" height="22" fill="#1c1917" rx="3"/>
  <text x="153" y="465" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">SELECT SIZE</text>

  <!-- Card 2 -->
  <rect x="286" y="322" width="226" height="158" fill="#ffffff" rx="6" filter="url(#f-shadow)"/>
  <rect x="296" y="332" width="206" height="74" fill="#f5f5f4" rx="4"/>
  <text x="296" y="422" fill="#1c1917" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Tailored Linen Blazer</text>
  <circle cx="302" cy="438" r="4" fill="#78716c"/>
  <circle cx="314" cy="438" r="4" fill="#292524"/>
  <text x="502" y="440" fill="#1c1917" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">৳ 6,250</text>
  <rect x="296" y="450" width="206" height="22" fill="#1c1917" rx="3"/>
  <text x="399" y="465" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">SELECT SIZE</text>

  <!-- Card 3 -->
  <rect x="532" y="322" width="228" height="158" fill="#ffffff" rx="6" filter="url(#f-shadow)"/>
  <rect x="542" y="332" width="208" height="74" fill="#f5f5f4" rx="4"/>
  <text x="542" y="422" fill="#1c1917" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Hand-carved Leather Tote</text>
  <circle cx="548" cy="438" r="4" fill="#b45309"/>
  <text x="750" y="440" fill="#1c1917" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">৳ 3,900</text>
  <rect x="542" y="450" width="208" height="22" fill="#1c1917" rx="3"/>
  <text x="646" y="465" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">VIEW PIECE</text>
</svg>
